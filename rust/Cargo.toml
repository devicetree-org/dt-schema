[workspace]
resolver = "2"
members = [
    "dtschema",
    "cli/dt-validate",
    "cli/dt-doc-validate",
    "cli/dt-mk-schema",
    "cli/dt-check-compatible",
    "cli/dt-extract-example",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/devicetree-org/dt-schema"

[workspace.dependencies]
dtschema = { path = "dtschema" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
jsonschema = { version = "0.49", default-features = false }
fdt = "0.1.5"
clap = { version = "4", features = ["derive"] }
argfile = "0.2"
regex = "1"
fancy-regex = "0.14"
sha2 = "0.10"
rayon = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
